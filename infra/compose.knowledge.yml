# 지식(RAG) 파일럿 스택 — spec §10/§16: 기존 회의 스택과 분리된 DB·큐·워커.
# 기동: docker compose -f infra/compose.knowledge.yml --env-file .env.knowledge up -d
# api 쪽 지식 라우트 활성화는 .env.production의 KNOWLEDGE_* flag로 별도 제어한다.
#
# 회의 스택과 같은 머신에서 회의 수집도 할 때만 오버라이드를 함께 쓴다:
#   docker compose -f infra/compose.knowledge.yml -f infra/compose.knowledge.meetingnet.yml \
#     --env-file .env.production --env-file .env.knowledge --profile discord up -d
# 오버라이드 없이 기동하면 외부 회의 네트워크 없이도 지식 스택이 독립으로 뜬다.
name: discord-knowledge

x-kapp: &kapp
  image: ${MEETING_IMAGE:-juncoy-meeting:0.1.0}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  env_file:
    - ../.env.production   # UPSTAGE_API_KEY, DISCORD_BOT_TOKEN 등 기존 자격증명 재사용
    - ../.env.knowledge    # KNOWLEDGE_*·GITHUB_APP_*·MEETING_DATABASE_URL
  user: '${MEETING_UID:-1000}:${MEETING_GID:-1000}'
  restart: unless-stopped
  stop_grace_period: 60s
  depends_on:
    postgres-knowledge:
      condition: service_healthy
  # 회의 스택과 달리 파일 로그 경로가 없어 json-file로 둔다 (운영 가시성).
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

networks:
  default:
  # meeting-net은 compose.knowledge.meetingnet.yml에서만 선언 — 외부 회의
  # 네트워크가 없는 환경에서도 기본 파일만으로 기동된다 (RAG-015).

services:
  postgres-knowledge:
    image: pgvector/pgvector:pg17
    container_name: discord-knowledge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:?Set KNOWLEDGE_POSTGRES_PASSWORD in .env.knowledge}
    ports:
      - 127.0.0.1:15440:5432
    volumes:
      - knowledge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knowledge -d knowledge]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    <<: *kapp
    restart: 'no'
    command: [node, --import, tsx, scripts/migrate-knowledge.ts]

  knowledge-worker:
    <<: *kapp
    volumes:
      - ../.data/knowledge:/data/knowledge
    container_name: discord-knowledge-worker
    command: [node, --import, tsx, apps/knowledge-worker/src/main.ts]
    depends_on:
      postgres-knowledge:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # 스키마 없이 큐를 읽지 않는다 (RAG-015)

  discord-context:
    <<: *kapp
    container_name: discord-knowledge-discord
    command: [node, --import, tsx, apps/discord-context/src/main.ts]
    profiles: [discord] # DISCORD_CONTEXT_ENABLED=true + 봇 intent 확정 후 기동

volumes:
  knowledge-pgdata:
    name: discord-knowledge-pgdata
