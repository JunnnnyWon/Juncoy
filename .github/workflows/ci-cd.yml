name: CI and API deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm build
  deploy:
    needs: check
    if: github.repository == 'JunnnnyWon/Juncoy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, juncoy-deploy]
    timeout-minutes: 20
    concurrency:
      group: juncoy-production-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Deploy exact commit to API
        run: bash infra/deploy-api.sh
